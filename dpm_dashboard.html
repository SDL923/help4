<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPM 운영 대시보드</title>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --border: #d8dee4;
    --border-soft: #eaeef2;
    --text: #1f2328;
    --text2: #59636e;
    --text3: #8c959f;

    --ok: #1f883d;      --ok-bg: #e6f6ea;   --ok-solid: #4ac26b;
    --fail: #cf222e;    --fail-bg: #ffebe9; --fail-solid: #e5534b;
    --run: #0969da;     --run-bg: #ddf4ff;  --run-solid: #218bff;
    --gray: #8c959f;    --gray-bg: #f0f2f5;
    --warn: #bf8700;    --warn-solid: #d4a72c;

    --accent: #0969da;
    --cur-col: #f0f7ff;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "D2Coding", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  }

  /* 실제 배포 화면의 왼쪽 사이드바 자리 (내용 없음). 폭은 --sidebar-w로 조정 */
  :root { --sidebar-w: 300px; }
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    flex: none; width: var(--sidebar-w);
    position: sticky; top: 0; height: 100vh;
    background: #f0f2f6; border-right: 1px solid var(--border);
  }
  .content { flex: 1; min-width: 1100px; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 24px;
    padding: 0 24px; height: 48px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .topbar .brand { font-weight: 700; font-size: 15px; letter-spacing: -0.2px; }
  .tabs { display: flex; gap: 4px; height: 100%; }
  .tab {
    display: flex; align-items: center; padding: 0 12px;
    color: var(--text2); border-bottom: 2px solid transparent; cursor: default;
  }
  .tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .tab.disabled { color: var(--text3); }
  .topbar .meta { margin-left: auto; color: var(--text3); font-size: 12px; }

  main { padding: 20px 24px 32px; display: grid; gap: 16px;
         grid-template-columns: auto 1fr; }

  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 18px; min-width: 0;
  }
  .panel.full { grid-column: 1 / -1; }
  .panel-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .panel-head h2 { margin: 0; font-size: 14px; font-weight: 700; }
  .panel-head .sub { color: var(--text3); font-size: 12px; }
  .panel-head .right { margin-left: auto; }

  /* ---------- legend ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--text2); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

  /* ---------- status symbols ---------- */
  .st { font-weight: 700; font-family: var(--mono); }
  .st.ok    { color: var(--ok); }
  .st.fail  { color: var(--fail); }
  .st.run   { color: var(--run); }
  .st.sched, .st.none { color: var(--gray); font-weight: 400; }

  /* ---------- (1) pipeline grid ---------- */
  table.pgrid { width: auto; border-collapse: separate; border-spacing: 0; }
  .pgrid th, .pgrid td { text-align: center; padding: 0; }
  .pgrid thead th {
    font-weight: 500; font-size: 11px; color: var(--text2);
    padding: 6px 3px; line-height: 1.25; font-family: var(--mono); font-size: 10px;
    border-bottom: 1px solid var(--border);
  }
  .pgrid thead th.prod-h { text-align: left; padding-left: 10px; font-family: inherit; }
  .pgrid thead th .end { color: var(--text3); }
  .pgrid thead th.cur {
    background: var(--run-bg); color: var(--run); font-weight: 700;
    border-radius: 6px 6px 0 0;
  }
  .pgrid thead th.cur .end { color: var(--run); opacity: .75; }
  .pgrid td { height: 28px; padding: 0 4px; border-bottom: 1px solid var(--border-soft); }
  /* 발행 현황 칸 — 모듈 × step 격자와 같은 칸 디자인 */
  .pc {
    display: inline-block; vertical-align: middle; width: 44px; height: 21px; border-radius: 3px;
    font: 600 10px/21px var(--mono); text-align: center; color: #fff;
  }
  .pc.ok    { background: var(--ok-solid); }
  .pc.fail  { background: var(--fail-solid); }
  .pc.run   { background: var(--run-solid); }
  .pc.sched { background: var(--gray-bg); border: 1px solid #dde2e7; }
  .pc.none  { background: repeating-linear-gradient(135deg, #fff 0 3px, #eef0f3 3px 5px); border: 1px solid var(--border-soft); }
  /* 발행 현황 동그라미 */
  .pd { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
  .pd.ok    { background: var(--ok-solid); }
  .pd.fail  { background: var(--fail-solid); }
  .pd.run   { background: var(--run-solid); animation: pulse 1.6s ease-in-out infinite; }
  .pd.sched { background: #fff; border: 1.5px solid #b6bec7; }
  .pd.none  { background: #dfe3e8; width: 8px; height: 8px; }
  .legend .pc { width: 12px; height: 12px; border-radius: 2px; }
  .pgrid td.cur { background: var(--cur-col); }
  .pgrid tbody tr:last-child td.cur { border-radius: 0 0 6px 6px; }
  .pgrid td.prod {
    text-align: left; padding-left: 10px; font-size: 13px; font-weight: 600;
    white-space: nowrap; border-left: 3px solid transparent;
  }
  .pgrid .prog {
    display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 10px;
    background: var(--gray-bg); color: var(--text2);
    font: 500 11px/18px var(--mono);
  }
  .pgrid td.pick { cursor: pointer; }
  .pgrid td.pick:hover .pd { box-shadow: 0 0 0 3px rgba(9,105,218,.28); }
  .pgrid td.sel .pd { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--text); }
  .pgrid tr.selected td.prod { border-left-color: var(--accent); color: var(--accent); }
  .pgrid tr.selected .prog { background: var(--run-bg); color: var(--run); }
  .pgrid tr:not(.clickable) td.prod { color: var(--text2); font-weight: 500; }
  .panel-foot { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
  .hint { color: var(--text3); font-size: 12px; }

  /* ---------- (2) detail ---------- */
  .dhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .dhead .pname { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
  }
  .badge.run   { background: var(--run-bg); color: var(--run); }
  .badge.sched { background: var(--gray-bg); color: var(--text2); }
  .badge.ok    { background: var(--ok-bg); color: var(--ok); }
  .badge.fail  { background: var(--fail-bg); color: var(--fail); }
  .badge.run .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .dhead .elapsed { color: var(--text2); }
  .dhead .elapsed b { color: var(--text); font-weight: 600; }
  .dhead .dag { margin-left: auto; color: var(--text3); font: 12px var(--mono); }


  .dbody { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start; }
  .sec-title { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }

  /* module × step grid */
  .mgrid { display: grid; gap: 3px; }
  .mgrid .mh { font: 500 10px/1 var(--mono); color: var(--text2); text-align: center; padding-bottom: 3px; }
  .mgrid .ml { font: 500 11px/21px var(--mono); color: var(--text2); padding-right: 6px; text-align: right; white-space: nowrap; }
  .mgrid .ml.fail { color: var(--fail); }
  .mgrid .ml.done { color: var(--ok); }
  .mc {
    width: 36px; height: 21px; border-radius: 3px;
    font: 600 10px/21px var(--mono); text-align: center; color: #fff;
  }
  .mc.done { background: var(--ok-solid); }
  .mc.run  { background: var(--run-solid); }
  .mc.wait { background: var(--gray-bg); border: 1px solid #dde2e7; }
  .mc.fail { background: var(--fail-solid); font-size: 12px; }
  .mc.none { background: repeating-linear-gradient(135deg, #fff 0 3px, #eef0f3 3px 5px); border: 1px solid var(--border-soft); }
  .mlegend { margin-top: 10px; max-width: 340px; }
  .mc[data-cell] { cursor: pointer; }
  .mc.focus { outline: 2px solid var(--text); outline-offset: 1px; }
  .mc.val { color: var(--text); font-weight: 500; position: relative; }
  .mc.val.dark { color: #fff; }
  .mc.val.live { box-shadow: inset 0 0 0 2px var(--run); }
  .mc.val.failed { box-shadow: inset 0 0 0 2px var(--fail); }
  .mc.val.warn::after {
    content: ''; position: absolute; top: 0; right: 0;
    border-style: solid; border-width: 0 7px 7px 0;
    border-color: transparent var(--fail) transparent transparent; border-top-right-radius: 3px;
  }
  .sw.warn-mk { background: linear-gradient(225deg, var(--fail) 0 40%, var(--gray-bg) 40%); }
  .grad { display: inline-block; width: 64px; height: 8px; border-radius: 2px; vertical-align: middle;
          background: linear-gradient(90deg, rgb(238,244,252), rgb(31,95,191)); }

  .viewbar { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .viewbar button {
    border: 0; border-right: 1px solid var(--border); background: #fff; padding: 4px 10px;
    font-size: 12px; font-family: inherit; color: var(--text2); cursor: pointer;
  }
  .viewbar button:last-child { border-right: 0; }
  .viewbar button:hover { background: #f6f8fa; }
  .viewbar button.on { background: var(--text); color: #fff; }

  /* finished-run summary */
  .tbd { border: 1px dashed var(--border); border-radius: 6px; padding: 28px; text-align: center; color: var(--text3); font-size: 12px; }
  .sum-sec { margin-bottom: 18px; }
  .sec-sub { font-weight: 400; color: var(--text3); margin-left: 6px; }
  .sec-sub b.up { color: var(--warn); }
  .sec-sub b.down { color: var(--ok); }
  .durline { display: flex; align-items: baseline; gap: 10px; }
  .delta { font: 600 18px var(--mono); }
  .delta.up { color: var(--warn); }
  .delta.down { color: var(--ok); }
  .muted { color: var(--text3); font-size: 12px; }
  .agroup { margin-bottom: 8px; }
  .atitle { font-size: 11px; color: var(--text2); margin: 0 0 2px 2px; }
  .atitle span { color: var(--text3); margin-left: 4px; font-family: var(--mono); }
  .alist { list-style: none; margin: 0; padding: 0; }
  .alist li { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .alist li:hover { background: #f6f8fa; }
  .alist li.on { background: #eef5ff; }
  .alist .ms { font: 500 12px var(--mono); }
  .alist .val { font: 12px var(--mono); color: var(--text2); margin-left: auto; }
  .amore { font-size: 11px; color: var(--text3); margin: 2px 0 0 10px; }
  .tag { font-size: 10px; padding: 0 6px; border-radius: 3px; line-height: 16px; min-width: 44px; text-align: center; }
  .tag.hi   { background: var(--fail-bg); color: var(--fail); }
  .tag.lo   { background: var(--gray-bg); color: var(--text2); }
  .failbox {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 7px 12px; margin-bottom: 12px; border-radius: 6px; cursor: pointer;
    background: var(--fail-bg); border: 1px solid #ffcecb; color: var(--fail); font-size: 12px;
  }
  .failbox .m { color: var(--text2); font-family: var(--mono); }
  .failbox .go { margin-left: auto; color: var(--text3); font-size: 11px; }

  /* resource table */
  table.rtable { width: 100%; border-collapse: collapse; }
  .rtable th {
    text-align: left; font-weight: 500; font-size: 11px; color: var(--text3);
    padding: 0 8px 6px; border-bottom: 1px solid var(--border);
  }
  .rtable td { padding: 8px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; white-space: nowrap; }
  .rtable td.ms { font: 500 12px var(--mono); }
  .rtable td.ms .step { color: var(--text2); }
  .rcell { display: flex; align-items: center; gap: 8px; }
  .bar {
    position: relative; width: 72px; height: 8px; border-radius: 4px;
    background: var(--gray-bg); flex: none; cursor: help;
  }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--run-solid); }
  .bar .req { position: absolute; top: -2px; bottom: -2px; width: 1px; margin-left: -0.5px; background: var(--text); border-radius: 1px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpi { border: 1px solid var(--border-soft); border-radius: 6px; padding: 5px 10px; background: #fafbfc; }
  .kpi .k { color: var(--text3); font-size: 11px; margin-bottom: 0; }
  .kpi .v { font: 600 14px/1.3 var(--mono); }
  .kpi .v small { font-size: 11px; font-weight: 400; color: var(--text2); }
  .kpi .v.warn { color: var(--warn); }
  .cpuv { font: 500 12px var(--mono); cursor: help; }
  .cpuv small { color: var(--text3); font-weight: 400; }
  .rval { font: 500 12px var(--mono); min-width: 52px; }
  .rval small { color: var(--text3); font-weight: 400; }
  .thr { font: 11px var(--mono); color: var(--text3); padding: 1px 6px; border-radius: 3px; background: var(--gray-bg); }
  .thr.hot { color: var(--warn); background: #fff8c5; }
  .rnote { margin-top: 8px; color: var(--text3); font-size: 11px; display: flex; gap: 14px; align-items: center; }
  .rnote .req-mark { display: inline-block; width: 1px; height: 10px; background: var(--text); vertical-align: middle; margin-right: 4px; }

  /* 이번 주 요약 */
  .back {
    margin-left: auto; border: 1px solid var(--border); background: #fff; border-radius: 6px;
    padding: 3px 10px; font-size: 12px; font-family: inherit; color: var(--text2); cursor: pointer;
  }
  .back:hover { background: #f6f8fa; color: var(--text); }
  .wsum { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--text2); }
  .wsum span { display: inline-flex; align-items: center; gap: 5px; }
  .wsum b { font: 600 13px var(--mono); color: var(--text); }
  .wsum .pd, .card .pd { width: 8px; height: 8px; }
  .cal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .cal-col { border-right: 1px solid var(--border-soft); min-height: 150px; padding: 0 6px 8px; display: flex; flex-direction: column; gap: 6px; }
  .cal-col:last-child { border-right: 0; }
  .cal-col.today { background: var(--cur-col); }
  .cal-h { margin: 0 -6px 2px; padding: 6px 8px; font-size: 12px; font-weight: 600; background: #fafbfc; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  .cal-h span { font: 400 11px var(--mono); color: var(--text3); margin-left: 2px; }
  .cal-col.today .cal-h { background: var(--run-bg); color: var(--run); }
  .cal-col.today .cal-h span { color: var(--run); }
  .cal-h em { font-style: normal; font-size: 10px; margin-left: 4px; padding: 0 6px; border-radius: 8px; background: var(--run); color: #fff; }
  .card { border: 1px solid var(--border); border-radius: 5px; padding: 5px 7px; background: #fff; font-size: 12px; }
  .card .c1 { display: flex; align-items: center; gap: 5px; }
  .card .c1 b { font-weight: 600; }
  .card .c1 .t { margin-left: auto; font: 11px var(--mono); color: var(--text3); }
  .card .c2 { margin-top: 2px; font: 11px var(--mono); color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.fail { background: var(--fail-bg); border-color: #ffcecb; }
  .card.fail .c2 { color: var(--fail); }
  .card.sched { border-style: dashed; background: transparent; }
  .card.sched .c2 { color: var(--text3); }
  .card.pick { cursor: pointer; }
  .card.pick:hover { border-color: var(--accent); box-shadow: 0 1px 3px rgba(9,105,218,.15); }
  .wd { font-weight: 600; }
  .wd.up { color: var(--warn); }
  .wd.down { color: var(--ok); }

  /* scheduled state */
  .sched-box {
    border: 1px dashed var(--border); border-radius: 8px; padding: 40px 20px;
    text-align: center; background: #fafbfc;
  }
  .sched-box .big { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .sched-box .big .t { color: var(--accent); font-family: var(--mono); }
  .sched-box .sub { color: var(--text2); }
  .notice {
    margin-top: 12px; padding: 8px 12px; border-radius: 6px;
    background: #f6f8fa; border-left: 3px solid var(--text3);
    color: var(--text2); font-size: 12px;
  }

  /* ---------- (3) raw_data ---------- */
  table.rawt { width: 100%; border-collapse: collapse; }
  .rawt th {
    text-align: left; font-weight: 500; font-size: 11px; color: var(--text3);
    padding: 0 12px 8px; border-bottom: 1px solid var(--border);
  }
  .rawt td { padding: 9px 12px; border-bottom: 1px solid var(--border-soft); }
  .rawt tr:last-child td { border-bottom: none; }
  .rawt td.prod { font-weight: 600; width: 120px; }
  .rawt td.stc { width: 140px; }
  .rawt td.stc .lbl { margin-left: 6px; color: var(--text2); font-size: 12px; }
  .rawt td.dur { width: 160px; font-family: var(--mono); font-size: 12px; }
  .rawt td.dur .k { color: var(--text3); font-family: inherit; margin-right: 6px; }
  .rawt td.next { width: 160px; font-family: var(--mono); font-size: 12px; color: var(--text2); }
  .rawt td.note { color: var(--text2); }
  .rawt tr.r-fail td.note { color: var(--fail); }
  .rawt tr.r-fail { background: #fffafa; }
  .rawsum { display: flex; gap: 14px; font-size: 12px; color: var(--text2); }
  .rawsum b { font-family: var(--mono); }

  /* ---------- tooltip ---------- */
  #tip {
    position: fixed; z-index: 100; pointer-events: none; display: none;
    background: #1f2328; color: #fff; font: 11px/1.5 var(--mono);
    padding: 6px 9px; border-radius: 5px; white-space: pre; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
</style>
</head>
<body>

<div class="app">
<aside class="sidebar" aria-hidden="true"></aside>
<div class="content">

<header class="topbar">
  <div class="brand">DPM</div>
  <nav class="tabs">
    <div class="tab active">1 · 운영 현황</div>
    <div class="tab disabled">2 · 리소스 추이</div>
    <div class="tab disabled">3 · 실행 이력</div>
  </nav>
  <div class="meta" id="meta"></div>
</header>

<main>
  <!-- (1) pipeline 발행 현황 -->
  <section class="panel" id="p1">
    <div class="panel-head">
      <h2>pipeline 발행 현황</h2>
    </div>
    <table class="pgrid" id="pgrid"></table>
    <div class="panel-foot">
      <div class="legend" id="legend1"></div>

    </div>
  </section>

  <!-- (2) 선택 제품 상세 -->
  <section class="panel" id="p2"></section>

  <!-- (3) raw_data 오늘 -->
  <section class="panel full" id="p3"></section>
</main>

</div>
</div>

<div id="tip"></div>

<script>
/* =====================================================================
   목업 데이터 — 수치는 전부 임의값. 여기만 바꾸면 화면이 바뀝니다.
   상태 코드: ok=성공 / fail=실패 / run=진행중 / sched=예정 / none=미실행
   ===================================================================== */
const MOCK = {
  // 화면 기준 "현재 시각". 주차·오늘 표시가 이 값으로 계산됨 (주 시작 = 월요일)
  now: '2026-11-04T07:30:00',

  pipeline: {
    weeks: 6,   // 표시할 주 수. history는 뒤에서부터 이 개수만큼 사용
    // history: 오래된 주 → 이번 주 순서, 8칸
    products: [
      { name: 'PBEQ', clickable: true,  history: ['ok','ok','ok','fail','ok','ok','ok','run'] },
      { name: 'PBEJ', clickable: true,  history: ['ok','ok','ok','ok','ok','fail','ok','run'] },
      { name: 'PBEK', clickable: true, history: ['ok','ok','ok','ok','ok','ok','ok','ok'] },
      { name: 'PBEM', clickable: false, history: ['ok','fail','ok','ok','ok','ok','ok','fail'] },
      { name: 'PBFA', clickable: false, history: ['ok','ok','none','ok','ok','ok','ok','ok'] },
      { name: 'PBFC', clickable: false, history: ['ok','ok','ok','ok','ok','ok','ok','sched'] },
      { name: 'PBGD', clickable: false, history: ['none','none','ok','ok','ok','ok','ok','sched'] },

};
const DOW = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');
const md = d => `${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
const NOW = new Date(MOCK.now);
let selected = null;   // { name, w } — 발행 현황의 칸(제품 × 주차). null이면 이번 주 요약

function weekRanges(n) {
  const mon = new Date(NOW);
  mon.setHours(0, 0, 0, 0);
  mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const s = new Date(mon); s.setDate(mon.getDate() - 7 * i);
    const e = new Date(s);   e.setDate(s.getDate() + 6);
    out.push({ start: md(s), end: md(e) });
  }
  return out;
}

function moduleProgress(name) {
  const d = MOCK.detail[name];
  if (!d) return null;
  if (!d.modules) return `0/${d.moduleCount}`;
  const done = d.modules.filter(m => m.cells.every(c => c === 'D')).length;
  return `${done}/${d.modules.length}`;
}

function fmtElapsed(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return h ? `${h}시간 ${m}분` : `${m}분`;
}

function legendHtml() {
  return Object.entries(ST).map(([k, v]) =>
    `<span><i class="pd ${k}"></i>${v.label}</span>`).join('');
}

/* ---------- (1) ---------- */
function renderPipeline() {
  const weeks = weekRanges(MOCK.pipeline.weeks);
  const last = weeks.length - 1;
  let h = '<thead><tr><th class="prod-h">제품</th>';
  weeks.forEach((w, i) => {
    h += `<th class="${i === last ? 'cur' : ''}">${w.start}<br><span class="end">~${w.end}</span></th>`;
  });
  h += '</tr></thead><tbody>';
  MOCK.pipeline.products.forEach(p => {
    const cls = [p.clickable && 'clickable', selected && p.name === selected.name && 'selected'].filter(Boolean).join(' ');
    const prog = p.clickable ? `<span class="prog">${moduleProgress(p.name)}</span>` : '';
    h += `<tr class="${cls}" data-name="${p.name}"><td class="prod">${p.name}${prog}</td>`;
    p.history.slice(-MOCK.pipeline.weeks).forEach((s, i) => {
      // 진행중이면 툴팁에 전체 경과 시간 추가
      const d = MOCK.detail[p.name];
      const tipRun = s === 'run' && d && d.elapsedMin ? ` · 경과 ${fmtElapsed(d.elapsedMin)}` : '';
      const pick = !!getRun(p.name, i);
      const sel = selected && selected.name === p.name && selected.w === i;
      const tcls = [i === last && 'cur', pick && 'pick', sel && 'sel'].filter(Boolean).join(' ');
      h += `<td class="${tcls}" ${pick ? `data-cellpick="${p.name}|${i}"` : ''} data-tip="${p.name} · ${weeks[i].start}~${weeks[i].end}\n${ST[s].label}${tipRun}${pick ? '\n클릭 → 실행 상세' : ''}"><i class="pd ${s}"></i></td>`;
    });
    h += '</tr>';
  });
  h += '</tbody>';
  const t = document.getElementById('pgrid');
  t.innerHTML = h;
  t.querySelectorAll('td.pick').forEach(td => td.addEventListener('click', () => {
    const [name, w] = td.dataset.cellpick.split('|');
    const same = selected && selected.name === name && selected.w === +w;
    selected = same ? null : { name, w: +w };
    focus = null;
    renderPipeline();
    renderDetail();
  }));
}

let view = 'status';   // 격자 보기: status | dur | mem | cpu | thr
let focus = null;      // 강조할 셀 키 ('M03.rank')

const VIEWS = [
  { key: 'status', label: '상태' },
  { key: 'dur',    label: '소요' },
  { key: 'mem',    label: '메모리 피크' },
  // { key: 'cpu',    label: 'CPU 평균' },   // 보류
  { key: 'thr',    label: 'throttle' },
];

const lerp = (a, b, x) => a + (b - a) * x;
const mean = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
const parseDur = s => { const [h, m] = s.split('h').map(Number); return h * 60 + m; };
const fmtShort = min => `${Math.floor(min / 60)}h${pad(min % 60)}`;
const fmtDT = s => { const d = new Date(s); return `${md(d)} (${DOW[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtHM = s => { const d = new Date(s); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

// 문자열 시드 난수 — 같은 셀은 항상 같은 목업 값
function rng(seed) {
  let h = 2166136261;
  for (const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => {
    h += 0x6D2B79F5;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 셀 하나의 리소스 값. 실행중 = Pod 현재값, 완료·실패 = 기록(피크/평균), 대기·미실행 = 없음
function cellMetric(pname, d, mod, step, code) {
  if (code === 'W' || code === 'N') return null;
  if (code.startsWith('R')) {
    const pod = (d.pods || []).find(p => p.module === mod && p.step === step);
    if (pod) return {
      live: true, dur: parseDur(code.split(':')[1]),
      memPeak: pod.mem.use, memAvg: null, memReq: pod.mem.req, memLim: pod.mem.lim,
      cpuAvg: pod.cpu.use, cpuPeak: null, cpuReq: pod.cpu.req, cpuLim: pod.cpu.lim, thr: pod.cpu.throttle,
    };
  }
  const P = MOCK.stepProfile[step];
  const r = rng(`${pname}.${mod}.${step}`);
  const memPeak = +(P.memReq * lerp(P.mem[0], P.mem[1], r())).toFixed(1);
  const cpuAvg = +lerp(P.cpu[0], P.cpu[1], r()).toFixed(1);
  const cpuPeak = +Math.min(P.cpuLim, cpuAvg * lerp(1.2, 1.6, r())).toFixed(1);
  const m = {
    live: false, failed: code === 'F',
    dur: Math.round(lerp(P.dur[0], P.dur[1], r())),
    memPeak, memAvg: +(memPeak * lerp(0.6, 0.85, r())).toFixed(1), memReq: P.memReq, memLim: P.memLim,
    cpuAvg, cpuPeak, cpuReq: P.cpuReq, cpuLim: P.cpuLim,
    thr: cpuPeak >= P.cpuLim * 0.9 ? Math.round(lerp(10, 28, r())) : Math.round(lerp(0, 6, r())),
  };
  if (m.failed && d.failure) { m.memPeak = d.failure.memAtFail; m.dur = d.failure.durMin; }
  return Object.assign(m, (d.overrides || {})[`${mod}.${step}`]);
}

function heat(t) {
  const a = [238, 244, 252], b = [31, 95, 191];
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t))})`;
}

function viewValue(m, v, maxDur) {
  if (v === 'dur') return { text: fmtShort(m.dur), t: m.dur / maxDur };
  if (v === 'mem') { const r = m.memPeak / m.memReq; return { text: m.memPeak.toFixed(1), t: Math.min(r, 1), warn: r >= 0.9 }; }
  if (v === 'cpu') return { text: m.cpuAvg.toFixed(1), t: Math.min(m.cpuAvg / m.cpuLim, 1) };
  if (v === 'thr') return { text: `${m.thr}%`, t: Math.min(m.thr / 30, 1), warn: m.thr >= 10 };
}

function cellTip(mod, step, code, m) {
  const st = code.startsWith('R') ? '실행중' : { D: '완료', W: '대기', F: '실패', N: '미실행' }[code];
  let t = `${mod} · ${step}  ${st}`;
  if (!m) return t;
  t += `\n${m.live ? '경과' : '소요'}    ${fmtShort(m.dur)}`;
  t += `\n메모리  ${m.live ? '현재' : '피크'} ${m.memPeak.toFixed(1)} / req ${m.memReq} / lim ${m.memLim} GiB`;
  if (m.memAvg != null) t += `  (평균 ${m.memAvg.toFixed(1)})`;
  t += `\nCPU     ${m.live ? '현재' : '평균'} ${m.cpuAvg.toFixed(1)}c`;
  if (m.cpuPeak != null) t += ` · 피크 ${m.cpuPeak.toFixed(1)}c`;
  t += ` / req ${m.cpuReq.toFixed(1)} / lim ${m.cpuLim.toFixed(1)}`;
  t += `\nthrottle ${m.thr}%`;
  return t;
}

function gridLegend(d) {
  if (view === 'status') return `
    <span><i class="sw" style="background:var(--ok-solid)"></i>완료</span>
    <span><i class="sw" style="background:var(--run-solid)"></i>실행중</span>
    <span><i class="sw" style="background:var(--gray-bg);border:1px solid #dde2e7"></i>대기</span>
    <span><i class="sw" style="background:var(--fail-solid)"></i>실패</span>
    <span><i class="sw" style="background:repeating-linear-gradient(135deg,#fff 0 3px,#eef0f3 3px 5px);border:1px solid var(--border-soft)"></i>미실행</span>`;
  const scale = { dur: '제품 내 최장 대비', mem: '피크 ÷ request', cpu: '평균 ÷ limit', thr: '0 ~ 30%' }[view];
  let h = `<span>낮음 <i class="grad"></i> 높음 <span style="color:var(--text3)">(${scale})</span></span>`;
  if (view === 'mem') h += `<span><i class="sw warn-mk"></i>request 90%↑</span>`;
  if (view === 'thr') h += `<span><i class="sw warn-mk"></i>10%↑</span>`;
  if (d.status === 'run') h += `<span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--run)"></i>실행중 (현재값)</span>`;
  if (d.modules.some(m => m.cells.includes('F'))) h += `<span><i class="sw" style="box-shadow:inset 0 0 0 2px var(--fail)"></i>실패</span>`;
  return h;
}

function gridHtml(d, metrics) {
  const steps = MOCK.steps;
  const maxDur = Math.max(1, ...metrics.flat().filter(Boolean).map(m => m.dur));
  let h = `<div class="viewbar">${VIEWS.map(v =>
    `<button data-view="${v.key}" class="${v.key === view ? 'on' : ''}">${v.label}</button>`).join('')}</div>`;
  h += `<div class="mgrid" style="grid-template-columns: auto repeat(${steps.length}, 36px)">`;
  h += '<div></div>' + steps.map(s => `<div class="mh">${s}</div>`).join('');
  d.modules.forEach((mod, mi) => {
    const mcls = mod.cells.includes('F') ? 'fail' : (mod.cells.every(c => c === 'D') ? 'done' : '');
    h += `<div class="ml ${mcls}">${mod.name}</div>`;
    mod.cells.forEach((c, i) => {
      const m = metrics[mi][i];
      const key = `${mod.name}.${steps[i]}`;
      const attrs = `data-cell="${key}" data-tip="${cellTip(mod.name, steps[i], c, m)}"`;
      const fc = focus === key ? ' focus' : '';
      if (view === 'status' || !m) {
        if (c.startsWith('R')) h += `<div class="mc run${fc}" ${attrs}>${c.split(':')[1]}</div>`;
        else h += `<div class="mc ${{ D: 'done', W: 'wait', F: 'fail', N: 'none' }[c]}${fc}" ${attrs}>${c === 'F' ? '×' : ''}</div>`;
      } else {
        const v = viewValue(m, view, maxDur);
        const cls = ['mc val', v.t > 0.55 && 'dark', m.live && 'live', m.failed && 'failed', v.warn && 'warn'].filter(Boolean).join(' ');
        h += `<div class="${cls}${fc}" style="background:${heat(v.t)}" ${attrs}>${v.text}</div>`;
      }
    });
  });
  h += `</div><div class="legend mlegend">${gridLegend(d)}</div>`;
  return h;
}

function barHtml(r, unit, decimals) {
  const pct = v => Math.min(100, (v / r.lim) * 100).toFixed(1);
  const tip = `값      ${r.use.toFixed(decimals)} ${unit}\nrequest ${r.req.toFixed(decimals)} ${unit}\nlimit   ${r.lim.toFixed(decimals)} ${unit}`;
  return `<div class="bar" data-tip="${tip}">
            <div class="fill" style="width:${pct(r.use)}%"></div>
            <div class="req" style="left:${pct(r.req)}%"></div>
          </div>
          <span class="rval">${r.use.toFixed(decimals)}<small> ${unit}</small></span>`;
}

function failHtml(f) {
  return `<div class="failbox" data-focus="${f.module}.${f.step}" data-setview="mem">
    <b>× ${f.module} · ${f.step} 실패</b><span>${f.reason}</span>
    <span class="m">직전 메모리 ${f.memAtFail} / limit ${f.memLim} GiB</span><span class="go">격자에서 보기</span></div>`;
}

// 실행 중: Pod 현재 리소스
function podsHtml(d) {
  let h = '';  // 실패 박스는 보류: d.failure ? failHtml(d.failure) : ''
  h += `<div class="sec-title">실행 중 Pod 리소스</div>`;
  // 합계 (실행 중 Pod 전체)
  const total = (k, f) => d.pods.reduce((a, p) => a + p[k][f], 0);
  const cpuUse = total('cpu', 'use'), cpuReq = total('cpu', 'req');
  h += `<div class="kpis">
    <div class="kpi"><div class="k">메모리 사용 / request 합</div>
      <div class="v">${total('mem', 'use').toFixed(1)} <small>/ ${total('mem', 'req')} GiB</small></div></div>
    <div class="kpi"><div class="k">CPU 사용 / request 합</div>
      <div class="v ${cpuUse > cpuReq ? 'warn' : ''}">${cpuUse.toFixed(1)}c <small>/ ${cpuReq.toFixed(1)}c</small></div></div>
  </div>
    <table class="rtable"><thead><tr><th>모듈·step</th><th>메모리</th><th>CPU</th></tr></thead><tbody>`;
  d.pods.forEach(p => {
    h += `<tr><td class="ms">${p.module}<span class="step">·${p.step}</span></td>
      <td><div class="rcell">${barHtml(p.mem, 'GiB', 1)}</div></td>
      <td><span class="cpuv" data-tip="사용    ${p.cpu.use.toFixed(1)} c
request ${p.cpu.req.toFixed(1)} c
limit   ${p.cpu.lim.toFixed(1)} c">${p.cpu.use.toFixed(1)}c</span></td></tr>`;
  });
  h += `</tbody></table>
    <div class="rnote"><span>막대 범위 0 ~ limit</span><span><i class="req-mark"></i>request</span></div>`;
  return h;
}

// 종료: 실행 요약 — 현재 미사용(보류). 평소 대비 소요 + request 조정이 필요한 셀
function summaryHtml(d, metrics) {
  const s = d.summary, steps = MOCK.steps;
  const cells = [];
  d.modules.forEach((mod, mi) => mod.cells.forEach((c, i) => {
    const m = metrics[mi][i];
    if (m) cells.push({ key: `${mod.name}.${steps[i]}`, label: `${mod.name}·${steps[i]}`, m });
  }));
  let h = '';  // 실패 박스는 보류: d.failure ? failHtml(d.failure) : ''

  // 평소 대비 소요
  const durs = s.recentDurMin, cur = durs[durs.length - 1];
  const avg = Math.round(mean(durs.slice(-5, -1)));
  const diff = Math.round((cur / avg - 1) * 100);
  h += `<div class="sum-sec"><div class="sec-title">평소 대비 소요</div>
    <div class="durline"><span class="delta ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : ''}${diff}%</span>
      <span class="muted">최근 4주 평균 ${fmtElapsed(avg)}</span></div></div>`;

  // request 조정 후보
  const ratio = c => c.m.memPeak / c.m.memReq;
  const hi = cells.filter(c => ratio(c) >= 0.9).sort((a, b) => ratio(b) - ratio(a));
  const lo = cells.filter(c => ratio(c) < 0.4).sort((a, b) => ratio(a) - ratio(b));
  const item = (c, tag, tcls) =>
    `<li data-focus="${c.key}" data-setview="mem" class="${focus === c.key ? 'on' : ''}">
       <span class="tag ${tcls}">${tag}</span><span class="ms">${c.label}</span>
       <span class="val">${c.m.memPeak.toFixed(1)} / ${c.m.memReq} GiB · ${Math.round(ratio(c) * 100)}%</span></li>`;
  const group = (title, list, tag, tcls, n = 3) => !list.length ? '' :
    `<div class="agroup"><div class="atitle">${title}<span>${list.length}건</span></div>
      <ul class="alist">${list.slice(0, n).map(c => item(c, tag, tcls)).join('')}</ul>
      ${list.length > n ? `<div class="amore">외 ${list.length - n}건 · 메모리 피크 보기에서 확인</div>` : ''}</div>`;
  h += `<div class="sum-sec"><div class="sec-title">메모리 request 조정 후보 <span class="sec-sub">클릭하면 격자에서 강조</span></div>`;
  h += hi.length || lo.length
    ? group('피크 ≥ request 90%', hi, '부족', 'hi') + group('피크 &lt; request 40%', lo, '과다', 'lo')
    : `<div class="muted">조정이 필요한 step 없음</div>`;
  h += `</div>`;
  return h;
}

// 선택한 칸(제품 × 주차)의 실행 데이터. 이번 주 = MOCK.detail, 지난 주 = 목업 생성(성공·실패만)
function getRun(name, w) {
  const base = MOCK.detail[name];
  if (!base) return null;
  const last = MOCK.pipeline.weeks - 1;
  if (w === last) return base;
  const p = MOCK.pipeline.products.find(x => x.name === name);
  const st = p.history.slice(-MOCK.pipeline.weeks)[w];
  if (st !== 'ok' && st !== 'fail') return null;
  const seed = `${name}#${w}`;
  const r = rng(seed);
  const n = MOCK.steps.length;
  const failMod = st === 'fail' ? Math.floor(r() * base.modules.length) : -1;
  const failStep = 1 + Math.floor(r() * (n - 1));
  const modules = base.modules.map((m, mi) => ({
    name: m.name,
    cells: Array.from({ length: n }, (_, si) =>
      mi !== failMod ? 'D' : si < failStep ? 'D' : si === failStep ? 'F' : 'N'),
  }));
  const [day, time] = (MOCK.schedule[name] || '월 02:00').split(' ');
  const start = new Date(NOW);
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7) - 7 * (last - w) + ['월', '화', '수', '목', '금'].indexOf(day));
  const [hh, mm] = time.split(':').map(Number);
  start.setHours(hh, mm);
  const end = new Date(start.getTime() + Math.round(lerp(280, 380, r())) * 60000);
  return { status: st, dag: base.dag, modules, summary: { start, end }, seed };
}

// 이번 주 요약 (제품 선택 전 기본 화면) — 요일 달력
function renderWeek() {
  const el = document.getElementById('p2');
  const DAYS = ['월', '화', '수', '목', '금'];   // 주말 실행 없음
  const mon = new Date(NOW);
  mon.setHours(0, 0, 0, 0);
  mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7));
  const todayIdx = (NOW.getDay() + 6) % 7;

  const items = MOCK.pipeline.products.map(p => {
    const st = p.history[p.history.length - 1];
    const d = MOCK.detail[p.name];
    const w = MOCK.thisWeek[p.name] || {};
    const [day, time] = (MOCK.schedule[p.name] || '').split(' ');
    let info = '';
    if (st === 'fail') info = `${w.failAt || ''} 실패`;
    if (st === 'run' && d) info = `${moduleProgress(p.name)} · ${fmtShort(d.elapsedMin)}`;
    if (st === 'ok') {
      let dur = w.durMin, avg = w.avgMin;
      if (d && d.summary) {
        const r = d.summary.recentDurMin;
        dur = r[r.length - 1];
        avg = Math.round(mean(r.slice(-5, -1)));
      }
      if (dur) {
        const diff = Math.round((dur / avg - 1) * 100);
        info = `${fmtShort(dur)} <span class="wd ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : ''}${diff}%</span>`;
      }
    }
    if (st === 'sched') info = '예정';
    if (st === 'none') info = '실행 없음';
    return { name: p.name, st, info, day: DAYS.indexOf(day), time: time || '', pick: p.clickable && !!d };
  });

  const cnt = st => items.filter(i => i.st === st).length;
  const fri = new Date(mon);
  fri.setDate(mon.getDate() + 4);
  let h = `<div class="panel-head"><h2>이번 주 요약</h2><span class="sub">pipeline · ${md(mon)} ~ ${md(fri)}</span>
    <div class="wsum">${['ok', 'fail', 'run', 'sched'].map(st =>
      `<span><i class="pd ${st}"></i>${ST[st].label} <b>${cnt(st)}</b></span>`).join('')}</div></div>`;

  h += '<div class="cal">';
  DAYS.forEach((dn, i) => {
    const dt = new Date(mon);
    dt.setDate(mon.getDate() + i);
    const list = items.filter(it => it.day === i).sort((x, y) => x.time.localeCompare(y.time));
    h += `<div class="cal-col ${i === todayIdx ? 'today' : ''}">
      <div class="cal-h">${dn} <span>${md(dt)}</span>${i === todayIdx ? '<em>오늘</em>' : ''}</div>`;
    list.forEach(it => {
      h += `<div class="card ${it.st}${it.pick ? ' pick' : ''}" ${it.pick ? `data-pick="${it.name}"` : ''}
               data-tip="${it.name} · ${dn} ${it.time}\n${ST[it.st].label}${it.pick ? '\n클릭 → 상세' : ''}">
        <div class="c1"><i class="pd ${it.st}"></i><b>${it.name}</b><span class="t">${it.time}</span></div>
        <div class="c2">${it.info}</div></div>`;
    });
    h += '</div>';
  });
  h += '</div><div class="hint" style="margin-top:10px">카드 클릭 → 제품 상세 (상세 데이터가 있는 제품)</div>';
  el.innerHTML = h;
}

function renderDetail() {
  if (!selected) { renderWeek(); return; }
  const { name, w } = selected;
  const d = getRun(name, w);
  if (!d) { selected = null; renderWeek(); return; }
  const el = document.getElementById('p2');
  const finished = d.status === 'ok' || d.status === 'fail';
  const wk = weekRanges(MOCK.pipeline.weeks)[w];
  const when = w === MOCK.pipeline.weeks - 1 ? '이번 주' : `${wk.start}~${wk.end}`;

  const badge = {
    run:   '<span class="badge run"><span class="dot">●</span>실행중</span>',
    sched: '<span class="badge sched">◷ 예정</span>',
    ok:    '<span class="badge ok">√ 완료</span>',
    fail:  '<span class="badge fail">× 실패</span>',
  }[d.status];

  let h = `<div class="panel-head"><h2>선택 제품 상세</h2><span class="sub">pipeline · ${when} 실행${finished ? ' (종료)' : ''}</span><button class="back" data-back>← 이번 주 요약</button></div>`;
  h += `<div class="dhead"><span class="pname">${name}</span>${badge}`;
  if (d.status === 'run') h += `<span class="elapsed">전체 경과 <b>${fmtElapsed(d.elapsedMin)}</b></span>`;
  if (finished) {
    const min = Math.round((new Date(d.summary.end) - new Date(d.summary.start)) / 60000);
    h += `<span class="elapsed">소요 <b>${fmtElapsed(min)}</b> · ${fmtDT(d.summary.start)} → ${fmtHM(d.summary.end)}</span>`;
  }
  h += `<span class="dag">${d.dag}</span></div>`;

  if (d.status === 'sched') {
    h += `<div class="sched-box">
      <div class="big"><span class="t">${d.scheduleText}</span> 실행 예정</div>
      <div class="sub">모듈 ${d.moduleCount}개 × ${MOCK.steps.length} step</div></div>`;
    el.innerHTML = h;
    return;
  }

  const metrics = d.modules.map(mod => mod.cells.map((c, i) => cellMetric(d.seed || name, d, mod.name, MOCK.steps[i], c)));

  h += `<div class="dbody"><div><div class="sec-title">모듈 × step</div>${gridHtml(d, metrics)}</div>
    <div>${finished ? '<div class="sec-title">실행 요약</div><div class="tbd">미정</div>' : podsHtml(d)}</div></div>`;
  el.innerHTML = h;
}

// 상세 패널 클릭: 보기 전환 / 셀·목록 강조
document.getElementById('p2').addEventListener('click', e => {
  const pk = e.target.closest('[data-pick]');
  if (pk) { selected = { name: pk.dataset.pick, w: MOCK.pipeline.weeks - 1 }; focus = null; renderPipeline(); renderDetail(); return; }
  if (e.target.closest('[data-back]')) { selected = null; focus = null; renderPipeline(); renderDetail(); return; }
  const b = e.target.closest('[data-view]');
  if (b) { view = b.dataset.view; renderDetail(); return; }
  const f = e.target.closest('[data-focus]');
  if (f) {
    const k = f.dataset.focus;
    focus = focus === k ? null : k;
    if (focus && f.dataset.setview) view = f.dataset.setview;
    renderDetail(); return;
  }
  const c = e.target.closest('[data-cell]');
  if (c) { focus = focus === c.dataset.cell ? null : c.dataset.cell; renderDetail(); }
});

/* ---------- (3) ---------- */
function renderRaw() {
  const rows = MOCK.rawData.rows;
  const cnt = s => rows.filter(r => r.status === s).length;
  let h = `<div class="panel-head"><h2>raw_data — 오늘</h2>
    <span class="sub">${md(NOW)} (${DOW[NOW.getDay()]}) · 전 제품 매일 1회</span>
    <div class="right rawsum">
      <span class="st ok">√ <b>${cnt('ok')}</b></span><span class="st run">• <b>${cnt('run')}</b></span>
      <span class="st fail">× <b>${cnt('fail')}</b></span><span class="st sched">· <b>${cnt('sched')}</b></span>
      <span class="st none">- <b>${cnt('none')}</b></span>
    </div></div>`;
  h += `<table class="rawt"><thead><tr><th>제품</th><th>오늘</th><th>경과/소요</th><th>다음 예정</th><th>비고</th></tr></thead><tbody>`;
  rows.forEach(r => {
    const dur = r.dur ? `<span class="k">${r.phase === 'elapsed' ? '경과' : '소요'}</span>${r.dur}` : '<span style="color:var(--text3)">—</span>';
    h += `<tr class="r-${r.status}"><td class="prod">${r.name}</td>
      <td class="stc"><span class="st ${r.status}">${ST[r.status].sym}</span><span class="lbl">${ST[r.status].label}</span></td>
      <td class="dur">${dur}</td><td class="next">${r.next}</td><td class="note">${r.note || ''}</td></tr>`;
  });
  h += '</tbody></table>';
  document.getElementById('p3').innerHTML = h;
}

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip;
  tip.style.display = 'block';
  const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
});

document.getElementById('meta').textContent =
  `기준 ${md(NOW)} (${DOW[NOW.getDay()]}) ${pad(NOW.getHours())}:${pad(NOW.getMinutes())} · 목업 데이터`;
document.getElementById('legend1').innerHTML = legendHtml();
renderPipeline();
renderDetail();
renderRaw();
</script>
